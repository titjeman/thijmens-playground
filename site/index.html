<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thijmens Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen 3D world, HUD floats on top — brand top-left, stats top-right, island dock bottom, detail panel right. Single dark theme by choice. */
:root {
  /* Layout: full-screen golden-hour world, soft frosted HUD floating on top. Single warm dusk theme by choice. */
  --void: #2a2440;
  --panel: rgba(36, 30, 56, 0.58);
  --panel-solid: #221f36;
  --line: rgba(255, 236, 214, 0.17);
  --ink: #fbf4ea;
  --dim: #d3c5b9;
  --cyan: #f2cf8f;      /* primary accent: warm gold */
  --magenta: #f0a8b8;   /* secondary accent: rose */
  --amber: #f4c27a;
  --good: #a3dbb4;
  --bad: #f2a0a0;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: linear-gradient(#2c2a5c, #b98597 62%, #f0c6a0);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
}
#world { position: fixed; inset: 0; display: block; width: 100%; height: 100%; cursor: grab; }
#world:active { cursor: grabbing; }
.hud { position: fixed; z-index: 5; pointer-events: none; }
.hud > * { pointer-events: auto; }

/* Brand */
.brand { top: 18px; left: 20px; }
.brand h1 {
  margin: 0; font-family: var(--font-display); font-weight: 500;
  font-size: clamp(24px, 3.4vw, 38px); letter-spacing: -0.01em; color: var(--ink);
  text-shadow: 0 2px 18px rgba(60, 30, 50, .35); text-wrap: balance;
}
.brand h1 em { font-style: italic; color: var(--cyan); font-weight: 500; }
.brand p { margin: 4px 0 0; font-size: 13px; color: var(--dim); text-shadow: 0 1px 8px rgba(40,20,40,.4); }
.brand .live { display: inline-flex; align-items: center; gap: 6px; }
.brand .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); animation: pulse 2s infinite; }
.brand .live.off i { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
@keyframes pulse { 50% { opacity: 0.35; } }

/* Stats */
.stats { top: 18px; right: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
.stat {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 9px 14px; backdrop-filter: blur(14px) saturate(1.2); min-width: 108px; box-shadow: 0 8px 30px rgba(40, 20, 50, .18);
}
.stat b { display: block; font-family: var(--font-display); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--dim); letter-spacing: 0.04em; }
.stat.attn b { color: var(--amber); }

/* Dock */
.dock {
  bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px; padding: 6px; flex-wrap: wrap; justify-content: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(14px) saturate(1.2);
  max-width: calc(100vw - 32px); box-shadow: 0 8px 30px rgba(40, 20, 50, .2);
}
.dock button {
  font-family: var(--font-body); font-size: 12.5px; font-weight: 600; letter-spacing: 0.01em;
  color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 999px;
  padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
}
.dock button:hover { border-color: var(--line); background: rgba(94, 240, 255, 0.06); }
.dock button.sel { background: rgba(255, 244, 228, .14); border-color: rgba(255, 236, 214, .35); }
.dock button.locked { color: var(--dim); }
.dock .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.dock .locked .dot { background: #3a4558; box-shadow: none; }
.dock .badge { font-family: var(--font-mono); font-size: 11px; background: var(--amber); color: #1a1000; border-radius: 6px; padding: 0 5px; }

/* Panel */
.panel {
  top: 92px; right: 20px; bottom: 92px; width: min(420px, calc(100vw - 40px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px; backdrop-filter: blur(18px) saturate(1.2);
  display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 50px rgba(40, 20, 50, .25);
  transition: transform .35s ease, opacity .35s ease;
}
.panel.hidden { transform: translateX(30px); opacity: 0; pointer-events: none; }
.panel header { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); position: relative; }
.panel header::before { content: ""; position: absolute; left: 18px; top: 0; width: 44px; height: 3px; border-radius: 0 0 3px 3px; background: var(--c, var(--cyan)); }
.panel h2 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 500; letter-spacing: -0.01em; text-wrap: balance; }
.panel .role { margin: 4px 0 0; color: var(--dim); line-height: 1.45; }
.panel .close { position: absolute; top: 14px; right: 14px; background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 16px; }
.panel .close:hover { color: var(--ink); }
.meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.meta div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.meta small { display: block; font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
.meta span { font-family: var(--font-mono); font-size: 12px; }
.panel .body { padding: 14px 18px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
.sect h3 { margin: 0 0 8px; font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }

/* Trust */
.trust { display: flex; gap: 4px; }
.trust i { flex: 1; height: 8px; border-radius: 999px; background: rgba(255,240,220,.12); }
.trust i.on { background: var(--c, var(--cyan)); }
.trust-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
.trust-row p { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.4; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: rgba(255,240,220,.12); border: 1px solid var(--line); position: relative; cursor: pointer; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); transition: left .2s; }
.switch input:checked { background: rgba(77, 255, 160, 0.25); border-color: var(--good); }
.switch input:checked::after { left: 18px; background: var(--good); }
.switch input:disabled { opacity: 0.4; cursor: not-allowed; }
.switch:has(input:disabled) { color: var(--dim); cursor: not-allowed; }

/* Pipeline */
.pipe { display: flex; gap: 4px; }
.pipe div { flex: 1; text-align: center; font-size: 11px; padding: 6px 2px; border-radius: 6px; border: 1px solid var(--line); color: var(--dim); }
.pipe div b { display: block; font-family: var(--font-display); font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pipe div.local { border-style: dashed; }

/* Output cards */
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: rgba(255, 245, 232, 0.05); border-left: 3px solid var(--st, var(--line)); }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card h4 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.35; }
.card .when { font-family: var(--font-mono); font-size: 11px; color: var(--dim); white-space: nowrap; }
.card .sum { margin: 6px 0 8px; color: #b8c6dc; line-height: 1.45; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--dim); }
.chip.pending { color: var(--amber); border-color: rgba(255, 181, 71, .45); }
.chip.approved { color: var(--good); border-color: rgba(77, 255, 160, .45); }
.chip.rejected, .chip.revise { color: var(--bad); border-color: rgba(255, 92, 108, .45); }
.chip.score { color: var(--magenta); border-color: rgba(255, 79, 216, .45); }
.actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.btn {
  font-family: var(--font-body); font-weight: 600; font-size: 12px; letter-spacing: 0.01em;
  border-radius: 999px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03); color: var(--ink);
}
.btn:hover { background: rgba(255, 255, 255, 0.08); }
.btn.ok { border-color: rgba(77, 255, 160, .5); color: var(--good); }
.btn.no { border-color: rgba(255, 92, 108, .5); color: var(--bad); }
.btn.redo { border-color: rgba(255, 181, 71, .5); color: var(--amber); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.empty { color: var(--dim); font-size: 13px; line-height: 1.5; border: 1px dashed var(--line); border-radius: 10px; padding: 12px; }
.note { font-size: 12px; color: var(--dim); line-height: 1.45; }
.note b { color: var(--ink); font-weight: 600; }

/* Activity */
.log { bottom: 92px; left: 20px; width: min(320px, calc(100vw - 40px)); font-size: 12px; color: var(--ink); text-shadow: 0 1px 8px rgba(40,20,40,.55); }
.log div { padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log div b { color: var(--c, var(--cyan)); font-weight: 500; }
.log h5 { margin: 0 0 4px; font-family: var(--font-body); letter-spacing: 0.12em; font-size: 11px; color: var(--ink); text-transform: uppercase; }

/* Labels over islands */

.agents { display: grid; gap: 10px; }
.agents.grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); margin-top: 12px; }
.agent { display: flex; gap: 12px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-left: 3px solid var(--c); }
.agent .av { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6ea 0 18%, var(--c) 60%); display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(255,255,255,.12); }
.agent .av span { font-family: Fraunces, Georgia, serif; font-weight: 700; color: #3d2f3a; font-size: 18px; }
.agent .av i { position: absolute; top: -8px; right: -6px; font-style: normal; font-size: 14px; color: var(--c); text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.agent h4 { margin: 0 0 2px; font-size: 15px; } .agent h4 small { font-weight: 400; color: var(--dim); font-size: 12px; }
.agent .note { margin: 2px 0 6px; }
.talents { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 6px; }
.talents span { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c) 22%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.ameta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--dim); }
.ameta span + span::before { content: "·"; margin-right: 10px; opacity: .6; }
.astat { font-size: 12px; }
.shifts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 10px; }
.shifts div { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); display: grid; gap: 2px; }
.shifts time { font-family: Fraunces, Georgia, serif; font-size: 18px; color: var(--cyan); } .shifts span { font-size: 12px; color: var(--dim); }
.clipgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.clipgrid video { width: 100%; aspect-ratio: 9/16; border-radius: 10px; background: #000; } .clipgrid figure { margin: 0; font-size: 12px; }
details.review summary { cursor: pointer; font-weight: 600; } details.review pre { white-space: pre-wrap; font-size: 11px; }

.stat-btn { font: inherit; color: inherit; text-align: left; cursor: pointer; }
.stat-btn:hover { background: rgba(242,207,143,.1); }
.usage-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: center; }
.usage-explain p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.55; }
.usage-explain a { color: var(--cyan); }
.chart.pool .t1 { font: 600 13px Manrope, system-ui, sans-serif; fill: #f4ece2; }
.chart.pool .t2 { font: 11px Manrope, system-ui, sans-serif; fill: #b7a9b4; }
.usage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 14px; }
h4.sub { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 10px 0 8px; display: flex; align-items: center; gap: 8px; }
.btn.mini { padding: 3px 9px; font-size: 11px; text-transform: none; letter-spacing: 0; }
.vtable.tasks tr.off { opacity: .5; }
@media (max-width: 860px) { .usage-top, .usage-grid { grid-template-columns: 1fr; } }
.labfocus { width: 100%; box-sizing: border-box; margin: 8px 0 4px; padding: 9px 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.18); color: inherit; font: inherit; font-size: 13px; }
.mdt { overflow-x: auto; margin: 8px 0; } .mdt table { border-collapse: collapse; font-size: 13px; width: 100%; } .mdt th, .mdt td { text-align: left; padding: 5px 9px; border-bottom: 1px solid rgba(255,255,255,.1); } .mdt th { color: var(--dim); font-weight: 600; }
.labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.lbl {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); will-change: transform; pointer-events: auto; cursor: pointer;
  font-family: var(--font-display); font-weight: 500; font-size: 15px; letter-spacing: 0;
  padding: 5px 14px 6px; border-radius: 999px; color: #3a2b3a; text-align: center;
  background: rgba(255, 250, 242, 0.88); white-space: nowrap; box-shadow: 0 6px 20px rgba(60, 30, 50, .22);
  border: 1px solid rgba(255,255,255,.6);
}
.lbl::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-right: 7px; vertical-align: 2px; }
.lbl.locked { background: rgba(255, 250, 242, 0.55); color: #5d4c5a; }
.lbl small { display: block; font-family: var(--font-body); font-size: 10.5px; color: #7d6a72; font-weight: 600; }
.lbl.sel { background: #fffaf2; outline: 2px solid var(--cyan); }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(2, 4, 8, 0.72); display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
.modal[hidden] { display: none; }
.sheet { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 22px; width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.sheet header { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.sheet header h3 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 500; text-wrap: balance; }
.sheet .content { padding: 16px 20px; overflow-y: auto; line-height: 1.6; }
.sheet .content > * { max-width: 66ch; }
.sheet .content h1, .sheet .content h2, .sheet .content h3 { font-family: var(--font-display); letter-spacing: 0.02em; margin: 18px 0 6px; }
.sheet .content h1 { font-size: 20px; } .sheet .content h2 { font-size: 17px; } .sheet .content h3 { font-size: 15px; color: var(--cyan); }
.sheet .content a { color: var(--cyan); }
.sheet .content code { font-family: var(--font-mono); font-size: 12px; background: rgba(255,240,220,.08); padding: 1px 4px; border-radius: 4px; }
.review { margin-top: 16px; border: 1px solid rgba(255, 79, 216, .35); border-radius: 10px; padding: 10px 12px; background: rgba(255, 79, 216, 0.05); }
.review h4 { margin: 0 0 4px; font-family: var(--font-body); color: var(--magenta); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.sheet footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.sheet textarea { width: 100%; min-height: 64px; resize: vertical; background: rgba(20,16,32,.6); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-family: var(--font-body); font-size: 13px; }
.sheet footer .actions { margin: 0; justify-content: flex-end; }

.toast { position: fixed; z-index: 30; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--panel-solid); border: 1px solid var(--line); padding: 8px 14px; border-radius: 9px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }


/* Results view */
.stat.btn-results { cursor: pointer; border-color: rgba(242,207,143,.5); text-align: left; font: inherit; color: inherit; }
.stat.btn-results b { color: var(--cyan); font-size: 19px; font-style: italic; padding-top: 2px; }
.stat.btn-results:hover { background: rgba(242,207,143,.12); }
.results { position: fixed; inset: 0; z-index: 15; background: rgba(30,26,46,.94); backdrop-filter: blur(6px); overflow-y: auto; padding: 24px clamp(16px, 4vw, 48px) 48px; }
.results[hidden] { display: none; }
.results .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.results h2 { margin: 0; font-family: var(--font-display); font-size: 34px; font-weight: 500; }
.results .head p { margin: 4px 0 0; color: var(--dim); max-width: 70ch; line-height: 1.5; }
.rgrid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
.rcard { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; min-width: 0; }
.rcard h3 { margin: 0 0 10px; font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.span12 { grid-column: span 12; } .span7 { grid-column: span 7; } .span5 { grid-column: span 5; } .span6 { grid-column: span 6; }
@media (max-width: 900px) { .span7, .span5, .span6 { grid-column: span 12; } }
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; position: relative; }
.tile b { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--dim); }
.tile i { position: absolute; right: 10px; top: 12px; font-style: normal; color: #3d4b66; font-size: 18px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--dim); font-family: var(--font-mono); font-size: 10px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--dim); margin-top: 6px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.ctip { position: fixed; z-index: 40; pointer-events: none; background: #2c2742; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; color: var(--ink); opacity: 0; transition: opacity .1s; }
.ctip.show { opacity: 1; }
.vtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.vtable th { text-align: left; font-family: var(--font-display); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.vtable td { padding: 8px; border-bottom: 1px solid rgba(120,200,255,.08); vertical-align: middle; }
.vtable .thumb { width: 40px; height: 70px; border-radius: 6px; background: rgba(255,240,220,.08) center/cover; border: 1px solid var(--line); }
.vtable input[type=number] { width: 78px; background: rgba(20,16,32,.6); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 4px 6px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.vtable label { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; font-size: 12px; color: var(--dim); white-space: nowrap; }
.vwrap { overflow-x: auto; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.timeline li { display: grid; grid-template-columns: 110px 1fr; gap: 10px; font-size: 13px; line-height: 1.4; }
.timeline time { font-family: var(--font-mono); font-size: 11px; color: var(--dim); }
.timeline b { color: var(--c, var(--ink)); font-weight: 600; }
.card video, .sheet video { width: 100%; max-height: 420px; border-radius: 8px; background: #000; margin-top: 8px; }
.dl { color: var(--cyan); font-size: 12px; }

:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<i>$2</i>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = String(src || "").split(/\r?\n/);
  let out = "", list = null;
  const close = () => { if (list) { out += list === "table" ? "</table></div>" : `</${list}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trimEnd();
    let m;
    if (!l.trim()) { close(); continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      const cells = l.trim().slice(1, -1).split("|").map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
      if (list !== "table") { close(); out += '<div class="mdt"><table>'; list = "table"; out += `<tr>${cells.map(c => `<th>${inline(c)}</th>`).join("")}</tr>`; continue; }
      out += `<tr>${cells.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`; continue;
    }
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { close(); const n = m[1].length; out += `<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; continue; }
    close(); out += `<p>${inline(l)}</p>`;
  }
  close();
  return out;
}
function ago(iso) {
  if (!iso) return "—";

  const s = (Date.now() - t) / 1000;
  if (s < 60) return "zojuist";
  if (s < 3600) return Math.round(s / 60) + " min geleden";

}
const todayKey = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Amsterdam" });

/* ---------- Database ---------- */
async function connect() {
  let db = null, user = null;
  for (let k = 0; k < 30 && !window.claude?.use; k++) await new Promise(r => setTimeout(r, 100));
  try { [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]); } catch (e) { db = null; }
  if (!db) { loadDemo(); world?.setAgents?.(state.agents); setLive(false, "voorbeelddata — open de pagina ingelogd"); renderAll(); return; }
  state.db = db;
  try { const w = user && await user.can?.("data.write"); state.canWrite = w === null || w === undefined ? true : !!w; } catch { state.canWrite = true; }
  const timer = setTimeout(() => setLive(false, "database nog niet bereikbaar"), 10000);
  const done = () => { clearTimeout(timer); setLive(true, state.canWrite ? "live" : "live · alleen bekijken"); };
  const fail = e => { clearTimeout(timer); setLive(false, "verbinding verbroken"); console.warn(e); };
  db.collection("islands").onSnapshot(s => { state.islands = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); if (!s.metadata.fromCache) done(); renderAll(); }, fail);
  db.collection("outputs").orderBy("createdAt", "desc").limit(150).onSnapshot(s => { state.outputs = s.docs.map(d => ({ id: d.id, ...d.data() })); if (!s.metadata.fromCache) done(); renderAll(); }, fail);
  db.collection("runs").orderBy("at", "desc").limit(1000).onSnapshot(s => { state.runs = s.docs.map(d => ({ id: d.id, ...d.data() })); renderAll(); }, fail);
  db.collection("agents").onSnapshot(s => { state.agents = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order ?? 99) - (b.order ?? 99)); world?.setAgents?.(state.agents.filter(a => a.enabled !== false)); renderAll(); }, fail);

}
function setLive(ok, txt) { $("live").classList.toggle("off", !ok); $("liveTxt").textContent = txt; }

async function writeIsland(id, patch) {

  const snap = await ref.get();

}
async function decide(o, decision, feedback) {

  if (!state.canWrite) { toast("Je kunt deze pagina alleen bekijken."); return false; }

  const now = new Date().toISOString();
  try {
    const patch = { status: decision, decidedAt: now, feedback: feedback.trim() || null };
    if (decision === "approved" && o.island === "video") patch.stage = "approved";
    await state.db.doc("outputs/" + o.id).update(patch);
    const cur = islandState(o.island);
    if (decision === "approved") await writeIsland(o.island, { trust: (cur.trust || 0) + 1 });
    if (decision === "approved" && o.island === "lab" && o.expansion?.slug) {
      const slug = String(o.expansion.slug).toLowerCase().replace(/[^a-z0-9-]/g, "-").slice(0, 40);
      const ref = state.db.doc("expansions/" + slug); const ex = await ref.get();
      if (!ex.exists) await ref.set({ name: o.expansion.name || o.title, short: o.expansion.short || o.expansion.name || slug, summary: o.expansion.summary || o.summary || "", fromOutput: o.id, status: "gepland", createdAt: now });
      toast("Nieuw eiland gepland: " + (o.expansion.name || slug));
    }
    else await writeIsland(o.island, { trust: 0, autonomous: false });
    toast(decision === "approved" ? "Goedgekeurd — vertrouwen +1" : decision === "revise" ? "Terug naar de agent met je feedback" : "Afgekeurd — vertrouwen terug naar 0");
    return true;

}

/* ---------- Levels & milestones ---------- */
const VILLAGE_XP = [0, 100, 250, 500, 900, 1500, 2400, 3600, 5000, 7000, 9500, 12500, 16000];
const ISLAND_XP = [0, 50, 150, 300, 600];
const VILLAGE_TITLES = ["Kampement", "Gehucht", "Dorpje", "Dorp", "Groot dorp", "Stadje", "Stad", "Havenstad", "Metropool", "Rijk", "Imperium", "Legende", "Mythe"];
let PROG = { total: 0, lvl: 1, islands: {}, milestones: [] };
function syncExpansions() {
  state.expansions.forEach((e, i) => {
    const d = expansionDef(e, i);
    if (!byId[d.id]) { ISLANDS.push(d); byId[d.id] = d; world?.addIsland(d); }

}
function views(o) { return ["yt", "tt", "ig"].reduce((a, k) => a + (+o.stats?.[k]?.views || 0), 0); }
function computeProgress() {
  const xp = {}; const add = (id, n) => { xp[id] = (xp[id] || 0) + n; };
  for (const o of state.outputs) {
    if (o.status === "approved") add(o.island, o.island === "lab" ? 60 : o.island === "workshop" ? 25 : 10);
    if (o.review && +o.review.score >= 8) add(o.island, 5);
    if (o.review) add("tower", 3);
    if (o.videoUrl) add("video", 50);
    for (const k of ["yt", "tt", "ig"]) { if (o.stats?.[k]?.posted) add("video", 40); add("video", Math.min(500, Math.floor((+o.stats?.[k]?.views || 0) / 100))); }
  }
  for (const [id, st] of Object.entries(state.islands)) if ((st.trust || 0) >= TRUST_GOAL) add(id, 100);
  add("village", state.expansions.length * 200);
  const total = Object.values(xp).reduce((a, b) => a + b, 0);
  const lvl = VILLAGE_XP.filter(t => total >= t).length;
  const islands = {}; for (const i of ISLANDS) { const x = xp[i.id] || 0; islands[i.id] = { xp: x, lvl: Math.min(5, ISLAND_XP.filter(t => x >= t).length) }; }
  const vids = state.outputs.filter(o => o.island === "video");
  const posted = vids.filter(o => ["yt", "tt", "ig"].some(k => o.stats?.[k]?.posted)).length;
  const totalViews = vids.reduce((a, o) => a + views(o), 0);
  const reviewed = state.outputs.filter(o => o.review).slice(0, 5);
  const days = new Set(state.runs.map(r => r.at && dayKey(r.at))); let streak = 0;
  for (let k = 0; k < 30; k++) { const d = new Date(Date.now() - k * 864e5).toLocaleDateString("sv-SE", { timeZone: "Europe/Amsterdam" }); if (days.has(d)) streak++; else if (k > 0) break; }
  const ms = [
    ["Eerste goedkeuring", "Je keurde voor het eerst werk van een agent goed.", state.outputs.some(o => o.status === "approved")],
    ["Eerste script", "De video-studio schreef zijn eerste script.", vids.length > 0],
    ["Eerste render", "Je pc maakte de eerste echte video.", vids.some(o => o.videoUrl)],
    ["Live!", "Je eerste video staat online.", posted >= 1],
    ["Tien op rij", "10 video's gepost.", posted >= 10],
    ["Een week vol", "7 dagen op rij hebben agents gewerkt.", streak >= 7],
    ["Scherp", "Gemiddelde controle-score 8+ over de laatste 5.", reviewed.length >= 5 && reviewed.reduce((a, o) => a + (+o.review.score || 0), 0) / reviewed.length >= 8],
    ["Eigen baas", "Een agent werkt voor het eerst autonoom.", Object.values(state.islands).some(st => st.autonomous)],
    ["Slimmer", "De werkplaats voerde een eerste verbetering door.", state.outputs.some(o => o.island === "workshop" && o.applied)],
    ["Het dorp groeit", "Je eerste nieuwe eiland is gepland.", state.expansions.length >= 1],
    ["1.000 views", "Samen 1.000 views.", totalViews >= 1000],
    ["10.000 views", "Samen 10.000 views.", totalViews >= 10000],
    ["100.000 views", "Samen 100.000 views.", totalViews >= 100000],
  ].map(([name, desc, done]) => ({ name, desc, done }));
  PROG = { total, lvl, next: VILLAGE_XP[lvl] ?? null, prev: VILLAGE_XP[lvl - 1], islands, milestones: ms, streak, totalViews };
  return PROG;
}

/* ---------- Work history ---------- */
const MIN_PER = { research: 45, video: 90, tower: 20, workshop: 40, lab: 60, sync: 10 };
function historyCard() {
  const runs = state.runs.filter(r => r.at);
  const byDay = {};
  const bump = (iso, k = 1) => { if (!iso) return; const d = dayKey(iso); byDay[d] = (byDay[d] || 0) + k; };

  const first = [...runs.map(r => r.at), ...state.outputs.map(o => o.createdAt)].filter(Boolean).sort()[0];
  const daysActive = Object.keys(byDay).length;
  const outs = state.outputs;
  const count = (isl, type) => outs.filter(o => o.island === isl && (!type || o.type === type)).length;
  const pitches = outs.filter(o => o.island === "research").reduce((a, o) => a + (o.pitches?.length || 0), 0);
  const reviews = outs.filter(o => o.review).length;
  const mins = runs.reduce((a, r) => a + (/geen|niets|overgeslagen|backlog vol/i.test(r.note || "") ? 0 : (MIN_PER[r.island] || 15)), 0);
  const hours = Math.round(mins / 60);
  // heatmap: last 26 weeks, Monday-first columns
  const W = 26, cell = 13, gap = 3, today = new Date();
  const start = new Date(today.getTime() - ((W - 1) * 7 + ((today.getDay() + 6) % 7)) * 864e5);
  const maxV = Math.max(3, ...Object.values(byDay));

  const cloud = rows.filter(r => r[1] !== "Je pc (render + clips)").length;
  return `<div class="rcard span12"><h3>Het team</h3>
    <p class="note">Elke ploeg is één geplande run die zijn agents <b>tegelijk</b> laat werken. Vandaag: <b>${cloud}</b> van de 5 cloud-runs gebruikt, dus ruimte over voor de knop van het Ideeënlab.</p>
    <div class="shifts">${rows.map(([t, n, who]) => `<div><time>${t}</time><b>${esc(n)}</b><span>${esc(who)}</span></div>`).join("")}</div>
    <div class="agents grid">${A.map(a => agentCard(a, true)).join("")}</div></div>`;
}
function renderResults() {
  const res = state.outputs.filter(o => o.island === "research");
  const vids = state.outputs.filter(o => o.island === "video" && o.status !== "redone");
  const pitches = res.reduce((a, o) => a + (o.pitches?.length || 0), 0);
  const approvedStories = res.filter(o => o.status === "approved").reduce((a, o) => { const m = (o.feedback || "").toUpperCase().match(/\b[A-E]\b/g); return a + (m ? m.length : (o.pitches?.length || 0)); }, 0);
  const rendered = vids.filter(o => o.videoUrl).length;
  const posted = vids.filter(o => o.stats && PLATFORMS.some(([k]) => o.stats[k]?.posted)).length;
  const views = vids.reduce((a, o) => a + PLATFORMS.reduce((b, [k]) => b + (+o.stats?.[k]?.views || 0), 0), 0);
  const tiles = [["Pitches gemaakt", pitches, "◇"], ["Verhalen goedgekeurd", approvedStories, "✓"], ["Scripts", vids.length, "✎"], ["Gerenderd", rendered, "▶"], ["Gepost", posted, "↑"], ["Views totaal", fmt(views), "◉"]];
  const canEdit = state.canWrite && !state.demo;
  const rows = vids.map(o => {
    const st = o.stats || {};
    const plats = PLATFORMS.map(([k, l]) => `<label><input type="checkbox" data-post="${esc(o.id)}" data-plat="${k}" ${st[k]?.posted ? "checked" : ""} ${canEdit ? "" : "disabled"}> ${l}</label><input type="number" min="0" aria-label="Views ${l}" placeholder="views" data-views="${esc(o.id)}" data-plat="${k}" value="${st[k]?.views ?? ""}" ${canEdit ? "" : "disabled"}>`).join("<br>");
    return `<tr>
      <td><div class="thumb" style="${o.coverUrl ? `background-image:url('${esc(o.coverUrl)}')` : ""}"></div></td>
      <td><b>${esc(o.title)}</b><br><span class="note">${esc(o.episodeCode || o.id)} · ${statusChip(o)} ${o.stage ? `<span class="chip">${esc((STAGES.find(x => x[0] === o.stage) || [0, o.stage])[1])}</span>` : ""} ${scoreChip(o)}</span></td>
      <td>${o.videoUrl ? `<a class="dl" href="${esc(o.videoUrl)}" target="_blank" rel="noopener">Preview</a>${o.cleanVideoUrl ? ` · <a class="dl" href="${esc(o.cleanVideoUrl)}" target="_blank" rel="noopener">Schoon</a>` : ""}<br><span class="note">${esc(o.localPath || "")}</span>` : `<span class="note">${o.renderError ? "Render-fout" : "nog niet gerenderd"}</span>`}</td>
      <td>${plats}</td></tr>`;
  }).join("");
  const events = [
    ...state.runs.map(r => ({ t: r.at, c: (byId[r.island] || {}).color, who: (byId[r.island] || { short: r.island }).short, what: r.note || "" })),
    ...state.outputs.filter(o => o.decidedAt).map(o => ({ t: o.decidedAt, c: "#e6f1ff", who: "Jij", what: `${{ approved: "keurde goed", rejected: "keurde af", revise: "vroeg om nieuwe versie" }[o.status] || o.status}: ${o.title}` })),
    ...state.outputs.filter(o => o.review?.at).map(o => ({ t: o.review.at, c: byId.tower.color, who: "Controle", what: `${o.review.score}/10 voor ${o.title}` })),
  ].filter(e => e.t).sort((a, b) => b.t.localeCompare(a.t)).slice(0, 18);
  const settings = state.islands.research?.settings;
  $("rBody").innerHTML = `
    ${usageCard()}
    <div class="rcard span12"><h3>Dorp &amp; mijlpalen</h3>
      <div class="village-big"><div><b>Niveau ${PROG.lvl}</b><span>${esc(VILLAGE_TITLES[PROG.lvl - 1] || "")} · ${PROG.total} XP${PROG.next ? ` · nog ${PROG.next - PROG.total} XP tot niveau ${PROG.lvl + 1}` : ""}</span></div>
      <div class="xpbar"><i style="width:${PROG.next ? Math.round(100 * (PROG.total - PROG.prev) / (PROG.next - PROG.prev)) : 100}%"></i></div></div>

      <div class="badges">${PROG.milestones.map(m => `<div class="badge2 ${m.done ? "done" : ""}" title="${esc(m.desc)}"><i aria-hidden="true">${m.done ? "★" : "☆"}</i><span><b>${esc(m.name)}</b><small>${esc(m.desc)}</small></span></div>`).join("")}</div>
      <p class="note" style="margin-top:10px">XP verdien je met goedkeuringen (+10), controle-scores van 8+ (+5), gerenderde video's (+50), posts (+40 per platform), views (+1 per 100), autonome agents (+100), verbeteringen van de werkplaats (+25), goedgekeurde ideeën (+60) en elk nieuw eiland (+200).</p></div>
    ${historyCard()}
    ${teamCard()}
    <div class="rcard span12"><h3>Productielijn</h3><div class="tiles">${tiles.map(([l, v, i]) => `<div class="tile"><i aria-hidden="true">${i}</i><b>${v}</b><span>${l}</span></div>`).join("")}</div>
      ${settings ? `<p class="note" style="margin-top:10px">Research-instelling: <b>${esc(settings.pitchesPerRun)}</b> pitches per run, pauze bij <b>${esc(settings.maxBacklog)}</b> klaarliggende verhalen. ${esc(settings.note || "")}</p>` : ""}</div>
    <div class="rcard span6"><h3>Geplande runs per dag</h3>${runsChart()}</div>
    <div class="rcard span6"><h3>Controle-score per eiland</h3>${scoreChart()}</div>
    <div class="rcard span7"><h3>Video's</h3>${rows ? `<div class="vwrap"><table class="vtable"><thead><tr><th></th><th>Aflevering</th><th>Bestand</th><th>Gepost &amp; views</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">Nog geen scripts. Zodra je een verhaal goedkeurt, maakt de video-studio er de volgende ochtend een script van.</div>`}</div>
    <div class="rcard span5"><h3>Laatste updates</h3>${events.length ? `<ul class="timeline">${events.map(e => `<li><time>${esc(new Date(e.t).toLocaleString("nl-NL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</time><span style="--c:${e.c}"><b>${esc(e.who)}</b> ${esc(e.what)}</span></li>`).join("")}</ul>` : `<div class="empty">Nog geen activiteit.</div>`}</div>`;
}
function openResults(on) {
  $("results").hidden = !on;
  if (on) { renderResults(); loadLiveTasks(); if (location.hash !== "#resultaten") history.replaceState(null, "", "#resultaten"); $("closeResults").focus(); }
  else if (location.hash === "#resultaten") history.replaceState(null, "", location.pathname + location.search);
}
$("openResults").onclick = () => openResults(true);
$("openUsage").onclick = () => { openResults(true); setTimeout(() => $("verbruik")?.scrollIntoView({ behavior: "smooth" }), 60); };
$("village").onclick = () => openResults(true);
$("closeResults").onclick = () => openResults(false);
addEventListener("hashchange", () => openResults(location.hash === "#resultaten"));
$("results").addEventListener("mousemove", e => { const t = e.target.closest("[data-tip]"); tip(e, t ? t.dataset.tip : null); });
$("results").addEventListener("mouseleave", e => tip(e, null));
let statsTimer = {};
async function saveStats(id, plat, patch) {
  const o = state.outputs.find(x => x.id === id); if (!o || !state.db) return;
  const stats = JSON.parse(JSON.stringify(o.stats || {}));
  stats[plat] = Object.assign({}, stats[plat], patch);
  const upd = { stats };
  if (PLATFORMS.some(([k]) => stats[k]?.posted) && o.stage !== "posted") upd.stage = "posted";
  try { await state.db.doc("outputs/" + id).update(upd); } catch (e) { console.warn(e); toast("Opslaan lukte niet."); }
}
$("results").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.post) saveStats(t.dataset.post, t.dataset.plat, { posted: t.checked, postedAt: t.checked ? new Date().toISOString() : null });
  if (t.dataset.views) { const k = t.dataset.views + t.dataset.plat; clearTimeout(statsTimer[k]); statsTimer[k] = setTimeout(() => saveStats(t.dataset.views, t.dataset.plat, { views: t.value === "" ? null : Math.max(0, +t.value), viewsAt: new Date().toISOString() }), 500); }
});

/* ---------- Modal ---------- */
let modalOut = null;
function openModal(id) {
  const o = state.outputs.find(x => x.id === id); if (!o) return;
  modalOut = o;
  $("mTitle").textContent = o.title || "Resultaat";
  $("mChips").innerHTML = statusChip(o) + scoreChip(o) + `<span class="chip">${esc((byId[o.island] || {}).short || o.island)}</span>`;
  let html = (o.videoUrl ? `<video controls src="${esc(o.videoUrl)}" ${o.coverUrl ? `poster="${esc(o.coverUrl)}"` : ""}></video><p class="note">Preview (720p). De 2K-versie om te uploaden staat op je pc: <code>${esc(o.localPath || "F:\\temp\\Playground\\videos")}</code></p>` : "") + (o.cleanVideoUrl ? `<details class="review"><summary>Schone versie voor docenten (${esc(o.cleanReplaced ?? "?")} vloek${o.cleanReplaced === 1 ? "" : "en"} weggepiept)</summary><video controls preload="none" src="${esc(o.cleanVideoUrl)}"></video><p class="note">Op je pc: <code>${esc(o.cleanLocalPath || "")}</code>. Upload deze als niet-openbare YouTube-video en zet de link in het lespakket.</p></details>` : "") + md(o.body || o.summary || "");
  if (o.clips?.length) html = `<h3>Clips (${o.clips.length})</h3><div class="clipgrid">${o.clips.map(c => `<figure>${c.previewUrl ? `<video controls preload="none" src="${esc(c.previewUrl)}"></video>` : ""}<figcaption><b>${esc(c.hook || c.file)}</b> · ${esc(c.seconds)} s<br>${esc(c.caption || "")}<br><span class="note">${esc((c.hashtags || []).join(" "))}</span><br><code>${esc(c.localPath || "")}</code></figcaption></figure>`).join("")}</div>` + html;
  if (o.packMd) html = `<div class="actions" style="margin:0 0 12px"><button class="btn ok" id="mPrint">Lespakket als PDF (afdrukken)</button></div>` + html;
  if (o.listing) html += `<div class="review"><h4>TPT-listing</h4><p><b>${esc(o.listing.title || "")}</b> · ${o.listing.price ? "$" + esc(o.listing.price) : "gratis"}</p><p>${esc(o.listing.description || "")}</p><p class="note">${esc((o.listing.tags || []).join(" · "))}</p></div>`;
  if (o.clipjob) html += `<details class="review"><summary>Clip-job voor je pc (technisch)</summary><pre>${esc(JSON.stringify(o.clipjob, null, 2))}</pre></details>`;
  if (o.review) html += `<div class="review"><h4>Controle-toren · ${esc(o.review.score ?? "?")}/10</h4>${md(o.review.notes || "")}</div>`;
  if (o.feedback) html += `<div class="review" style="border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.05)"><h4 style="color:var(--amber)">Jouw feedback</h4><p>${esc(o.feedback)}</p></div>`;
  $("mContent").innerHTML = html;
  $("mFooter").style.display = o.status === "pending" ? "" : "none";
  $("mFeedback").value = "";
  $("modal").hidden = false; $("mClose").focus();
  const pr = $("mPrint"); if (pr) pr.onclick = () => printPack(o);
}
function printPack(o) {
  const w = open("", "_blank"); if (!w) { toast("Sta pop-ups toe om te printen."); return; }
  w.document.write(`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>${esc(o.listing?.title || o.title)}</title><style>
    body{font:12pt/1.55 Georgia,serif;color:#222;max-width:720px;margin:28px auto;padding:0 24px} h1,h2,h3{font-family:Helvetica,Arial,sans-serif;color:#3d2f3a} h1{font-size:22pt;border-bottom:3px solid #9fc5e8;padding-bottom:6px}
    h2{font-size:15pt;margin-top:22px} li{margin:4px 0} table{border-collapse:collapse;width:100%} td,th{border:1px solid #ccc;padding:4px 8px} .mdt{margin:8px 0}
    @media print{h2{break-after:avoid} h2:has(+*){break-inside:avoid}}</style></head><body>${md(o.packMd)}<script>setTimeout(()=>print(),400)<\/script></body></html>`);
  w.document.close();
}
function closeModal() { $("modal").hidden = true; modalOut = null; }
$("mClose").onclick = closeModal;
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("modal").hidden) closeModal(); else if (!$("results").hidden) openResults(false); else select(null); } });
for (const [btn, dec] of [["mApprove", "approved"], ["mReject", "rejected"], ["mRedo", "revise"]]) {
  $(btn).onclick = async () => { if (modalOut && await decide(modalOut, dec, $("mFeedback").value)) closeModal(); };
}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-open],[data-approve],[data-id]"); if (!t) return;
  if (t.dataset.open) openModal(t.dataset.open);
  else if (t.dataset.approve) { const o = state.outputs.find(x => x.id === t.dataset.approve); if (o) { t.disabled = true; if (!await decide(o, "approved", "")) t.disabled = false; } }
  else if (t.dataset.id && t.closest("#dock")) select(t.dataset.id === state.selected ? null : t.dataset.id);
});
$("pClose").onclick = () => select(null);

/* ---------- 3D world ---------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let world = null;
const LABELS = {};
function renderLabels() {
  const box = $("labels");
  if (box.childElementCount !== ISLANDS.length) {
    for (const k in LABELS) delete LABELS[k];
    box.innerHTML = ISLANDS.map(i => `<div class="lbl ${i.locked ? "locked" : ""}" style="--c:${i.color}" data-lbl="${i.id}" role="button" tabindex="0">${esc(i.name)}<small></small></div>`).join("");
    box.querySelectorAll(".lbl").forEach(el => {
      LABELS[el.dataset.lbl] = el;
      el.addEventListener("click", () => select(el.dataset.lbl));
      el.addEventListener("keydown", e => { if (e.key === "Enter") select(el.dataset.lbl); });
    });
  }
  ISLANDS.forEach(i => {
    const el = LABELS[i.id];
    el.classList.toggle("sel", state.selected === i.id);
    const n = state.outputs.filter(o => o.island === i.id && o.status === "pending").length;
    el.querySelector("small").textContent = i.planned ? "gepland" : i.locked ? "binnenkort" : n ? `${n} wacht op jou` : `vertrouwen ${Math.min(islandState(i.id).trust || 0, TRUST_GOAL)}/${TRUST_GOAL}`;
  });
}
function placeLabels(pos) {
  for (const id in pos) {
    const el = LABELS[id]; if (!el) continue; const p = pos[id];
    if (!p) { el.style.display = "none"; continue; }
    el.style.display = ""; el.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -100%)`;
  }
}
function updateIslandGlow() {
  if (!world) return;
  const m = {}; for (const o of state.outputs) if (o.status === "pending") m[o.island] = true;
  world.setPending(m);
}

/* ---------- Selection ---------- */
function select(id) {
  state.selected = id;
  world?.select(id);
  renderAll();
}

/* ---------- Boot ---------- */
renderAll();
try {
  const { createWorld } = await import("./js/world.js");
  world = createWorld({ canvas: $("world"), islands: ISLANDS.filter(i => !i.planned), reduceMotion: reduce, onSelect: id => select(id), onFrame: placeLabels });
  ISLANDS.filter(i => i.planned).forEach(d => world.addIsland(d));
  world.setAgents?.(state.agents.filter(a => a.enabled !== false));
  updateIslandGlow(); renderProgress();
} catch (e) { console.warn("3D-wereld kon niet laden", e); $("world").style.background = "linear-gradient(#3a3a7a, #c98a9a 60%, #f3c9a0)"; }
connect();
if (location.hash === "#resultaten") openResults(true);
</script>
</body>
</html>
